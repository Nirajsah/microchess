name: Docker Image CI Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag microchess:v1 --progress=plain

      - name: Test Docker image
        run: docker run --rm microchess:v1 echo "Docker build successful!"
