[package]
name = "chess"
version = "0.1.0"
edition = "2021"

[dependencies]
async-graphql = { version = "=7.0.17", default-features = false }
async-graphql-derive = { version = "=7.0.17", default-features = false }
linera-sdk = { version = "0.15.3", default-features = false }
serde = { version = "1.0.203", features = ["derive"] }
log = "0.4.22"
lazy_static = "1.5.0"
thiserror = "2.0.1"
futures = "0.3.31"
sha3 = "0.10.8"
bcs = "0.1.6"
base64 = "0.22.1"
chess_lib = { path = "../chess_lib" }
tracing = "0.1.40"


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
linera-sdk = { version = "0.15.3", features = ["test", "wasmer"] }

[dev-dependencies]
linera-sdk = { version = "0.15.3", features = ["test"] }
env_logger = "0.11.5"
tokio = "1.48"

[[bin]]
name = "chess_contract"
path = "src/contract.rs"

[[bin]]
name = "chess_service"
path = "src/service.rs"

